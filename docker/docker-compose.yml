services:
  blog:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4000:4000"
      - "35729:35729"   # livereload
    volumes:
      - ..:/site
      - bundle_cache:/usr/local/bundle
    command: >
      bundle exec jekyll serve
      --host 0.0.0.0
      --config _config.yml,_config.dev.yml
      --livereload
      --force_polling

volumes:
  bundle_cache:
